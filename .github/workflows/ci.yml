name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q tests/test_store.py tests/test_service.py tests/test_llm.py
        env:
          TEST_DATABASE_URL: postgresql://intake:intake@localhost:5432/intake_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake
          POSTGRES_DB: intake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
